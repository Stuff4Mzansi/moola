name: Spec-driven development

on:
  pull_request:

permissions:
  contents: read

jobs:
  spec-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate spec package and implementation linkage
        run: python scripts/spec_guard.py check --base "origin/${{ github.base_ref }}"
