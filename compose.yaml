name: moola

services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      APP_NAME: Moola
      APP_ENV: production
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: ${APP_LOCALE:-en}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/moola/moola.sqlite
      DB_FOREIGN_KEYS: "true"
      DB_BUSY_TIMEOUT: "5000"
      DB_JOURNAL_MODE: WAL
      DB_SYNCHRONOUS: NORMAL
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
    volumes:
      - moola-data:/var/lib/moola
      - moola-storage:/var/www/html/storage
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/www/html/bootstrap/cache:size=4m,mode=0770,uid=33,gid=33
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 0.80
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',9000,$$e,$$m,2); exit($$s ? 0 : 1);"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${MOOLA_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0770,uid=101,gid=101
      - /var/run:size=1m,mode=0770,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.20
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  moola-data:
  moola-storage:
